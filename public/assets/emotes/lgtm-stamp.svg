<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <rect x="8" y="8" width="112" height="112" rx="28" fill="#022C22" stroke="#065F46" stroke-width="2"/>
    <!-- Tilted Stamp Container -->
    <g transform="rotate(-10 64 64)">
      <!-- Outer Double Border -->
      <rect x="20" y="32" width="88" height="58" rx="8" fill="none" stroke="#34A853" stroke-width="3"/>
      <rect x="24" y="36" width="80" height="50" rx="5" fill="#064E3B" fill-opacity="0.6" stroke="#34A853" stroke-width="1.5" stroke-dasharray="4 2"/>
      <!-- Main Text LGTM -->
      <text x="56" y="68" font-family="monospace" font-size="20" font-weight="900" fill="#34D399" letter-spacing="2" text-anchor="middle">LGTM</text>
      <!-- Big Checkmark -->
      <path d="M80 54L87 62L98 48" stroke="#34A853" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Sub-label: APPROVED -->
      <text x="64" y="80" font-family="monospace" font-size="7" font-weight="bold" fill="#A7F3D0" letter-spacing="3" text-anchor="middle">APPROVED</text>
    </g>
    <!-- Stamp Ink Dots -->
    <circle cx="28" cy="28" r="2" fill="#34A853" fill-opacity="0.4"/>
    <circle cx="102" cy="100" r="2.5" fill="#34A853" fill-opacity="0.4"/>
  </svg>