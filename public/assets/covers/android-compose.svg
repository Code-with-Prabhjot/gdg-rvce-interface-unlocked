<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200px" height="675px" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D12"/>
      <stop offset="60%" stop-color="#121721"/>
      <stop offset="100%" stop-color="#182030"/>
    </linearGradient>
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Architectural Grid Layer -->
  <rect width="1200" height="675" fill="url(#gridPattern)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="1020" cy="220" r="280" fill="#34A853" fill-opacity="0.16" filter="url(#softGlow)"/>
  <circle cx="200" cy="500" r="200" fill="#4285F4" fill-opacity="0.08" filter="url(#softGlow)"/>

  <!-- Architectural Frame (clean top & bottom 64px corner margins for UI overlays) -->
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

  <!-- Technical Spec Subheader (Safely inside body safe-zone below top overlay pills) -->
  <text x="84" y="132" font-family="monospace" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.5">GDG ON CAMPUS RVCE // SYSTEM SPEC · 12.9237° N, 77.4987° E</text>

  <!-- Left Content Column (Strictly bounded to x <= 700 for clean clearance) -->
  <g transform="translate(84, 152)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="204" height="34" rx="17" fill="#34A853" fill-opacity="0.18" stroke="#34A853" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#34A853"/>
    <text x="34" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC" letter-spacing="1">CODE LAB SESSION</text>

    <!-- Main Title -->
    <text x="0" y="88" font-family="sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8"><tspan x="0" dy="0">Modern Android &amp;</tspan><tspan x="0" dy="48">Compose</tspan></text>
    
    <!-- Subtitle -->
    <text x="0" y="182" font-family="sans-serif" font-size="20" font-weight="500" fill="#94A3B8"><tspan x="0" dy="0">Declarative UI Engineering with Kotlin</tspan><tspan x="0" dy="28">&amp; Material 3</tspan></text>

    <!-- Meta specs -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="250" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="16" y="26" font-family="monospace" font-size="13" fill="#E2E8F0">MOBILE // JETPACK COMPOSE</text>
    </g>
  </g>

  <!-- Right Visual Feature (Shifted cleanly right around x = 945-965) -->
  <g transform="translate(765, 165) scale(0.90)">
    
      <!-- Phone Wireframe Frame -->
      <rect x="120" y="20" width="180" height="320" rx="24" fill="#0A0D12" stroke="#34A853" stroke-width="3"/>
      <rect x="140" y="46" width="140" height="20" rx="6" fill="rgba(52,168,83,0.3)"/>
      <rect x="140" y="76" width="140" height="60" rx="10" fill="rgba(66,133,244,0.2)" stroke="#4285F4" stroke-width="1.5"/>
      <rect x="140" y="146" width="65" height="65" rx="10" fill="rgba(251,188,4,0.2)" stroke="#FBBC04" stroke-width="1.5"/>
      <rect x="215" y="146" width="65" height="65" rx="10" fill="rgba(234,67,53,0.2)" stroke="#EA4335" stroke-width="1.5"/>
      <rect x="140" y="222" width="140" height="34" rx="17" fill="#34A853"/>
      <text x="210" y="244" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BUILD UI</text>
    
  </g>

  <!-- Brand Signature (Separated 4-colour chevrons, clear of bottom 64px corner margins) -->
  <g transform="translate(84, 514)">
    <!-- Left chevron (Red & Blue) -->
    <path d="M9 -8L0 0" stroke="#EA4335" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 0L9 8" stroke="#4285F4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right chevron (Green & Yellow) -->
    <path d="M16 -8L25 0" stroke="#34A853" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 0L16 8" stroke="#FBBC04" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="4" font-family="sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">GDG RVCE</text>
    <text x="118" y="4" font-family="sans-serif" font-size="13" fill="#94A3B8">— Bengaluru Developer Community</text>
  </g>
</svg>