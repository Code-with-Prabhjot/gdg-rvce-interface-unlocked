<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200px" height="675px" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D12"/>
      <stop offset="60%" stop-color="#121721"/>
      <stop offset="100%" stop-color="#182030"/>
    </linearGradient>
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Architectural Grid Layer -->
  <rect width="1200" height="675" fill="url(#gridPattern)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="1020" cy="220" r="280" fill="#4285F4" fill-opacity="0.16" filter="url(#softGlow)"/>
  <circle cx="200" cy="500" r="200" fill="#4285F4" fill-opacity="0.08" filter="url(#softGlow)"/>

  <!-- Architectural Frame & Tech Coordinates -->
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="40" y1="90" x2="1160" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Technical Coordinate Badges -->
  <text x="70" y="72" font-family="monospace" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="2">GDG ON CAMPUS RVCE // ARCHITECTURAL SYSTEM SPEC</text>
  <text x="1130" y="72" font-family="monospace" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="end" letter-spacing="2">12.9237° N, 77.4987° E</text>

  <!-- Left Content Column (Strictly bounded to x <= 700 for clean clearance) -->
  <g transform="translate(84, 170)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="223" height="34" rx="17" fill="#4285F4" fill-opacity="0.18" stroke="#4285F4" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#4285F4"/>
    <text x="34" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC" letter-spacing="1">DEEP-DIVE WORKSHOP</text>

    <!-- Main Title -->
    <text x="0" y="88" font-family="sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8"><tspan x="0" dy="0">Cloud Architecture &amp;</tspan><tspan x="0" dy="48">K8s</tspan></text>
    
    <!-- Subtitle -->
    <text x="0" y="182" font-family="sans-serif" font-size="20" font-weight="500" fill="#94A3B8"><tspan x="0" dy="0">Production Kubernetes on Google Cloud</tspan><tspan x="0" dy="28">Platform</tspan></text>

    <!-- Meta specs -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="242" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="16" y="26" font-family="monospace" font-size="13" fill="#E2E8F0">INFRA // GKE &amp; CLOUD RUN</text>
    </g>
  </g>

  <!-- Right Visual Feature (Shifted cleanly right around x = 945-965) -->
  <g transform="translate(780, 175) scale(0.90)">
    
      <!-- Hexagonal Cloud Pods -->
      <g stroke="#4285F4" stroke-width="2" fill="rgba(66,133,244,0.12)">
        <polygon points="120,40 180,75 180,145 120,180 60,145 60,75"/>
        <polygon points="260,40 320,75 320,145 260,180 200,145 200,75"/>
        <polygon points="190,160 250,195 250,265 190,300 130,265 130,195"/>
      </g>
      <!-- Connections -->
      <line x1="180" y1="110" x2="200" y2="110" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="150" y1="160" x2="160" y2="195" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="120" cy="110" r="16" fill="#4285F4"/>
      <circle cx="260" cy="110" r="16" fill="#34A853"/>
      <circle cx="190" cy="230" r="16" fill="#FBBC04"/>
    
  </g>

  <!-- Bottom Brand Signature -->
  <g transform="translate(84, 580)">
    <!-- GDG Chevron Icon Mini -->
    <path d="M0 8L8 0L0 -8" stroke="#EA4335" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 -8L-8 0L0 8" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="4" font-family="sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">GDG RVCE</text>
    <text x="110" y="4" font-family="sans-serif" font-size="14" fill="#64748B">— Bengaluru Developer Community</text>
  </g>
</svg>