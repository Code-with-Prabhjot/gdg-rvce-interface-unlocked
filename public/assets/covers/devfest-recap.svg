<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200px" height="675px" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D12"/>
      <stop offset="60%" stop-color="#121721"/>
      <stop offset="100%" stop-color="#182030"/>
    </linearGradient>
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Architectural Grid Layer -->
  <rect width="1200" height="675" fill="url(#gridPattern)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="1020" cy="220" r="280" fill="#FBBC04" fill-opacity="0.16" filter="url(#softGlow)"/>
  <circle cx="200" cy="500" r="200" fill="#4285F4" fill-opacity="0.08" filter="url(#softGlow)"/>

  <!-- Architectural Frame & Tech Coordinates -->
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="40" y1="90" x2="1160" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Technical Coordinate Badges -->
  <text x="70" y="72" font-family="monospace" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="2">GDG ON CAMPUS RVCE // ARCHITECTURAL SYSTEM SPEC</text>
  <text x="1130" y="72" font-family="monospace" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="end" letter-spacing="2">12.9237° N, 77.4987° E</text>

  <!-- Left Content Column (Strictly bounded to x <= 700 for clean clearance) -->
  <g transform="translate(84, 170)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="223" height="34" rx="17" fill="#FBBC04" fill-opacity="0.18" stroke="#FBBC04" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#FBBC04"/>
    <text x="34" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC" letter-spacing="1">ANNUAL CELEBRATION</text>

    <!-- Main Title -->
    <text x="0" y="88" font-family="sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8"><tspan x="0" dy="0">DevFest Bengaluru</tspan><tspan x="0" dy="48">Recap</tspan></text>
    
    <!-- Subtitle -->
    <text x="0" y="182" font-family="sans-serif" font-size="20" font-weight="500" fill="#94A3B8"><tspan x="0" dy="0">Celebrating Student Builders &amp; Keynote</tspan><tspan x="0" dy="28">Sprints</tspan></text>

    <!-- Meta specs -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="275" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="16" y="26" font-family="monospace" font-size="13" fill="#E2E8F0">ANNUAL // GDG CAMPUS NETWORK</text>
    </g>
  </g>

  <!-- Right Visual Feature (Shifted cleanly right around x = 945-965) -->
  <g transform="translate(775, 175) scale(0.90)">
    
      <!-- Confetti & Celebration Radiance -->
      <circle cx="200" cy="160" r="100" fill="none" stroke="#FBBC04" stroke-width="2" stroke-dasharray="6 6"/>
      <circle cx="200" cy="160" r="60" fill="rgba(251,188,4,0.15)"/>
      <polygon points="200,120 212,148 240,148 218,166 226,194 200,176 174,194 182,166 160,148 188,148" fill="#FBBC04" stroke="#CA8A04" stroke-width="2"/>
      <!-- Scattered Confetti -->
      <rect x="90" y="80" width="12" height="6" rx="2" fill="#4285F4" transform="rotate(25 90 80)"/>
      <rect x="300" y="100" width="10" height="5" rx="2" fill="#EA4335" transform="rotate(-35 300 100)"/>
      <rect x="110" y="240" width="12" height="6" rx="2" fill="#34A853" transform="rotate(45 110 240)"/>
      <rect x="290" y="230" width="10" height="5" rx="2" fill="#FBBC04" transform="rotate(-15 290 230)"/>
    
  </g>

  <!-- Bottom Brand Signature -->
  <g transform="translate(84, 580)">
    <!-- GDG Chevron Icon Mini -->
    <path d="M0 8L8 0L0 -8" stroke="#EA4335" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 -8L-8 0L0 8" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="4" font-family="sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">GDG RVCE</text>
    <text x="142" y="4" font-family="sans-serif" font-size="14" fill="#64748B">— Bengaluru Developer Community</text>
  </g>
</svg>