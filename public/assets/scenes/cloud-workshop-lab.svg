      <rect x="0" y="70" width="310" height="4" fill="#4285F4"/>
      <rect x="310" y="70" width="310" height="4" fill="#EA4335"/>
      <rect x="620" y="70" width="310" height="4" fill="#FBBC04"/>
      <rect x="930" y="70" width="310" height="4" fill="#34A853"/>

      <!-- 4 Pairs of Pair-Programmers (8 Students Total) in High Detail -->
      <!-- Pair 1 (Left, Collab Debugging) -->
      <g transform="translate(60, 40)">
        <!-- Dev A (Typing) -->
        <circle cx="30" cy="15" r="18" fill="#FDBA74"/>
        <path d="M12 12C12 -4 30 -6 45 -2C48 10 46 18 46 18Z" fill="#0F172A"/>
        <path d="M8 90C8 45 52 45 52 90Z" fill="#4285F4"/>
