          <path d="M2 45C2 24 38 24 38 45Z" fill="#151F32"/>
          <!-- Workstation Monitor -->
          <rect x="25" y="10" width="32" height="24" rx="2" fill="#0A0E1A" stroke="#475569" stroke-width="1.5"/>
          <rect x="27" y="12" width="28" height="20" rx="1" fill="#4285F4" fill-opacity="0.8"/>
        </g>
      
        <g transform="translate(240, 0)">
          <!-- Developer Silhouette -->
          <circle cx="20" cy="8" r="14" fill="#334155"/>
          <path d="M2 45C2 24 38 24 38 45Z" fill="#151F32"/>
          <!-- Workstation Monitor -->
          <rect x="25" y="10" width="32" height="24" rx="2" fill="#0A0E1A" stroke="#475569" stroke-width="1.5"/>
          <rect x="27" y="12" width="28" height="20" rx="1" fill="#34A853" fill-opacity="0.8"/>
        </g>
      
        <g transform="translate(440, 0)">
          <!-- Developer Silhouette -->
          <circle cx="20" cy="8" r="14" fill="#334155"/>
          <path d="M2 45C2 24 38 24 38 45Z" fill="#151F32"/>
          <!-- Workstation Monitor -->
          <rect x="25" y="10" width="32" height="24" rx="2" fill="#0A0E1A" stroke="#475569" stroke-width="1.5"/>
          <rect x="27" y="12" width="28" height="20" rx="1" fill="#4285F4" fill-opacity="0.8"/>
        </g>
      
        <g transform="translate(620, 0)">
          <!-- Developer Silhouette -->
          <circle cx="20" cy="8" r="14" fill="#334155"/>
          <path d="M2 45C2 24 38 24 38 45Z" fill="#151F32"/>
          <!-- Workstation Monitor -->
          <rect x="25" y="10" width="32" height="24" rx="2" fill="#0A0E1A" stroke="#475569" stroke-width="1.5"/>
          <rect x="27" y="12" width="28" height="20" rx="1" fill="#34A853" fill-opacity="0.8"/>
        </g>
      
        <g transform="translate(820, 0)">
          <!-- Developer Silhouette -->
          <circle cx="20" cy="8" r="14" fill="#334155"/>
          <path d="M2 45C2 24 38 24 38 45Z" fill="#151F32"/>
          <!-- Workstation Monitor -->
          <rect x="25" y="10" width="32" height="24" rx="2" fill="#0A0E1A" stroke="#475569" stroke-width="1.5"/>
          <rect x="27" y="12" width="28" height="20" rx="1" fill="#4285F4" fill-opacity="0.8"/>
        </g>
      
        <g transform="translate(1000, 0)">
          <!-- Developer Silhouette -->
          <circle cx="20" cy="8" r="14" fill="#334155"/>
          <path d="M2 45C2 24 38 24 38 45Z" fill="#151F32"/>
          <!-- Workstation Monitor -->
          <rect x="25" y="10" width="32" height="24" rx="2" fill="#0A0E1A" stroke="#475569" stroke-width="1.5"/>
          <rect x="27" y="12" width="28" height="20" rx="1" fill="#34A853" fill-opacity="0.8"/>
        </g>
      
    </g>

    <!-- Bench 2 (Foreground, y=520-720) -->
